  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r; gap: 10px;\n  padding: 8px 10px; border-radius: 10px; cursor: pointer;\n}\n.user-chip:hover { background: var(--surface-2); }\n.avatar {\n  width: 34px; height: 34px; border-radius: 50%; flex: none;\n  background: #fff; color: var(--ink);\n  display: grid; place-items: center; font-weight: 700; font-size: 13px;\n  border: 1px solid var(--line-2);\n  overflow: hidden;\n}\n.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }\n.user-meta { min-width: 0; }\n.user-name { font-weight: 700; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.user-sub { font-size: 11.5px; color: var(--ink-3); }\n\n/* ----- Topbar ----- */\n.topbar {\n  position: sticky; top: 0; z-index: 30;\n  height: var(--top-h);\n  background: rgba(255,255,255,.86);\n  backdrop-filter: saturate(180%) blur(12px);\n  border-bottom: 1px solid var(--line);\n  display: flex; align-items: center; gap: 14px;\n  padding: 0 28px;\n}\n.crumb { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-weight: 600; font-size: 13px; }\n.crumb b { color: var(--ink); font-weight: 700; }\n.topbar-spacer { flex: 1; }\n.searchbox {\n  display: flex; align-items: center; gap: 9px;\n  background: var(--surface-2); border: 1px solid transparent;\n  border-radius: var(--r-pill); padding: 8px 14px; width: 280px;\n  color: var(--ink-3); transition: border .12s, background .12s;\n}\n.searchbox:focus-within { background: #fff; border-color: var(--line-2); }\n.searchbox input { border: 0; background: transparent; outline: none; font-family: inherit; font-size: 13.5px; color: var(--ink); width: 100%; }\n.searchbox .ic { width: 16px; height: 16px; }\n\n.icon-btn {\n  width: 40px; height: 40px; border-radius: var(--r-pill);\n  border: 1px solid var(--line-2); background: #fff;\n  display: grid; place-items: center; color: var(--ink-2);\n  position: relative; transition: background .12s, color .12s, border-color .12s;\n}\n.icon-btn:hover { bac center; gap: 5px;\n  height: 22px; padding: 0 9px; border-radius: 999px;\n  font-size: 11.5px; font-weight: 700; letter-spacing: .01em; line-height: 1;\n}\n.svc-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }\n.svc-pill.live { background: var(--pos-bg); color: var(--pos); }\n.svc-pill.paused { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }\n\n/* config sections */\n.svc-section { padding: 22px; border-top: 1px solid var(--line); transition: opacity .15s; }\n.svc-section[aria-disabled=\"true\"] { opacity: .45; pointer-events: none; }\n.svc-section-head { margin-bottom: 16px; }\n.svc-section-title { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }\n.svc-section-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; max-width: 540px; }\n\n.svc-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }\n.svc-fields .field { margin: 0; }\n.svc-fields .field-wide { grid-column: 1 / -1; }\n\n/* range input — two inputs joined by an en-dash */\n.range-input {\n  display: grid; grid-template-columns: 1fr auto 1fr auto;\n  align-items: center; gap: 0;\n  height: 42px; padding: 0 4px;\n  border: 1px solid var(--line-2); border-radius: 10px; background: #fff;\n  transition: border-color .12s, box-shadow .12s;\n}\n.range-input:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,.07); }\n.range-input input {\n  width: 100%; height: 100%; border: 0; outline: none; background: transparent;\n  font-family: inherit; font-size: 14px; color: var(--ink); padding: 0 6px 0 12px;\n  font-variant-numeric: tabular-nums; text-align: left;\n}\n.range-input .dash { color: var(--ink-3); font-weight: 700; padding: 0 4px; }\n.range-input .suffix { padding: 0 14px 0 4px; color: var(--ink-3); font-weight: 600; font-size: 13px; }\n\n/* affix money input */\n.money-input { position: relative; }\n.money-input .pfx {\n  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);\n  color: var(--ink-3); font-weight: 700; font-size: 14px; pointer-events: none;\n  font-variant-numeric: tabular-nums;\n}\n.money-input .input { padding-left: 32px; font-variant-numeric: tabular-nums; }\n.money-input.wide .input { padding-left: 52px; }\n\n/* preview strip (storefront-style chip) */\n.svc-preview {\n  display: flex; align-items: center; gap: 12px; padding: 14px 18px;\n  background: var(--surface-2); border-top: 1px solid var(--line);\n  border-radius: 0 0 var(--r-lg) var(--r-lg);\n  font-size: 13px; color: var(--ink-2); font-weight: 600;\n}\n.svc-preview .ic { width: 15px; height: 15px; color: var(--ink-3); flex: none; }\n.svc-preview b { color: var(--ink); font-weight: 700; }\n.svc-preview .sep { color: var(--line-strong); padding: 0 4px; }\n\n/* single-value time input (mirrors range-input) */\n.time-input {\n  display: inline-grid; grid-template-columns: 1fr auto;\n  align-items: center; width: 100%;\n  height: 42px; padding: 0 4px;\n  border: 1px solid var(--line-2); border-radius: 10px; background: #fff;\n  transition: border-color .12s, box-shadow .12s;\n}\n.time-input:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,.07); }\n.time-input input {\n  width: 100%; height: 100%; border: 0; outline: none; background: transparent;\n  font-family: inherit; font-size: 14px; color: var(--ink); padding: 0 6px 0 12px;\n  font-variant-numeric: tabular-nums; text-align: left;\n}\n.time-input .suffix { padding: 0 14px 0 4px; color: var(--ink-3); font-weight: 600; font-size: 13px; }\n\n/* ===================== delivery: General vs Custom ===================== */\n.mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }\n.mode-card {\n  display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 13px;\n  text-align: left; padding: 15px 16px; border-radius: 13px;\n  border: 1.5px solid var(--line-2); background: #fff; color: var(--ink);\n  transition: border-color .14s, box-shadow .14s, background .14s;\n}\n.mode-card:hover { border-color: var(--line-strong); }\n.mode-card .mode-radio {\n  width: 18px; height: 18px; border-radius: 50%; flex: none;\n  border: 1.6px solid var(--line-strong); background: #fff;\n  position: relative; transition: border-color .14s;\n}\n.mode-card .mode-ic {\n  width: 38px; height: 38px; border-radius: 11px; flex: none;\n  background: var(--surface-2); border: 1px solid var(--line);\n  display: grid; place-items: center; color: var(--ink-2);\n  transition: background .14s, color .14s, border-color .14s;\n}\n.mode-card .mode-ic .ic { width: 18px; height: 18px; }\n.mode-card .mode-name { display: block; font-weight: 700; font-size: 14px; letter-spacing: -.01em; }\n.mode-card .mode-sub { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }\n.mode-card.active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }\n.mode-card.active .mode-radio { border-color: var(--ink); border-width: 5px; }\n.mode-card.active .mode-ic { background: var(--ink); color: #fff; border-color: var(--ink); }\n\n/* panels swap in below the switch */\n.mode-panel { display: none; margin-top: 18px; }\n.mode-panel.show { display: block; animation: fadeIn .26s ease; }\n\n/* custom zone list */\n.zone-list { display: flex; flex-direction: column; gap: 8px; }\n.zone-row {\n  display: grid; grid-template-columns: 26px minmax(0,1fr) 132px 118px 36px;\n  align-items: center; gap: 10px;\n  padding: 8px; border: 1px solid var(--line-2); border-radius: 12px; background: #fff;\n  transition: border-color .12s, box-shadow .12s, opacity .14s;\n}\n.zone-row:hover { border-color: var(--line-strong); }\n.zone-row.dragging { opacity: .4; }\n.zone-row.drop-target { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,.06); }\n.zone-grip {\n  width: 26px; height: 38px; border: 0; background: transparent; border-radius: 8px;\n  display: grid; place-items: center; color: var(--ink-3); cursor: grab; touch-action: none;\n}\n.zone-grip:hover { color: var(--ink); background: var(--surface-2); }\n.zone-grip:active { cursor: grabbing; }\n.zone-grip .ic { width: 16px; height: 16px; }\n.zone-row .zname {\n  height: 38px; border: 1px solid transparent; border-radius: 9px; background: var(--surface-2);\n  padding: 0 12px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); outline: none;\n  transition: background .12s, border-color .12s, box-shadow .12s; min-width: 0;\n}\n.zone-row .zname::placeholder { color: var(--ink-3); font-weight: 500; }\n.zone-row .zname:hover { background: var(--surface-3); }\n.zone-row .zname:focus { background: #fff; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,.07); }\n.zone-affix {\n  display: grid; align-items: center; height: 38px; background: var(--surface-2);\n  border: 1px solid transparent; border-radius: 9px; padding: 0 12px;\n  transition: background .12s, border-color .12s, box-shadow .12s;\n}\n.zone-affix.money { grid-template-columns: auto 1fr; }\n.zone-affix.time { grid-template-columns: 1fr auto; }\n.zone-affix:hover { background: var(--surface-3); }\n.zone-affix:focus-within { background: #fff; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,.07); }\n.zone-affix input {\n  width: 100%; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;\n  font-family: inherit; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums;\n}\n.zone-affix .pfx, .zone-affix .sfx { color: var(--ink-3); font-weight: 700; font-size: 13.5px; flex: none; }\n.zone-affix.money .pfx { padding-right: 4px; }\n.zone-affix.time .sfx { padding-left: 4px; font-weight: 600; }\n.zone-del {\n  width: 36px; height: 38px; border: 0; background: transparent; border-radius: 9px;\n  display: grid; place-items: center; color: var(--ink-3); transition: background .12s, color .12s;\n}\n.zone-del:hover { background: var(--neg-bg); color: var(--neg); }\n.zone-del .ic { width: 16px; height: 16px; }\n\n/* column captions above the rows */\n.zone-head {\n  display: grid; grid-template-columns: 26px minmax(0,1fr) 132px 118px 36px;\n  gap: 10px; padding: 0 8px 2px;\n  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3);\n}\n.zone-head span:nth-child(1) { grid-column: 2; }\n\n.zone-add {\n  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;\n  height: 40px; padding: 0 15px; border-radius: 10px;\n  border: 1.5px dashed var(--line-strong); background: #fff; color: var(--ink);\n  font-family: inherit; font-weight: 700; font-size: 13.5px;\n  transition: border-color .13s, background .13s, color .13s;\n}\n.zone-add:hover { border-color: var(--ink); background: var(--surface-2); }\n.zone-add .ic { width: 16px; height: 16px; }\n\n/* empty state */\n.zone-empty { display: none; text-align: center; padding: 30px 20px 26px; }\n.zone-empty.show { display: block; }\n.zone-empty .ze-ic {\n  width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 14px;\n  background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-3);\n}\n.zone-empty .ze-ic .ic { width: 22px; height: 22px; }\n.zone-empty .ze-title { font-weight: 700; font-size: 14px; }\n.zone-empty .ze-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; max-width: 340px; margin-inline: auto; line-height: 1.45; }\n\n@media (max-width: 720px) {\n  .svc-fields { grid-template-columns: 1fr; }\n  .svc-status { grid-template-columns: 48px 1fr; }\n  .svc-status .svc-act { grid-column: 1 / -1; padding-left: 64px; }\n  .mode-switch { grid-template-columns: 1fr; }\n  .zone-row { grid-template-columns: 22px minmax(0,1fr) 1fr 36px; }\n  .zone-row .ztime-cell { grid-column: 3; }\n  .zone-head { display: none; }\n}\n<\u002Fstyle>\n<script src=\"b58ae931-8f78-4810-94f7-feac319e8141\"><\u002Fscript>\n<\u002Fhead>\n<body data-page=\"delivery\">\n<div class=\"layout\">\n  <aside class=\"sidebar\" id=\"sidebar\"><\u002Faside>\n  <div class=\"main-col\">\n    <header class=\"topbar\" id=\"topbar\"><\u002Fheader>\n    <main class=\"content\">\n\n      <div class=\"page-head\">\n        <div>\n          <h1 class=\"page-title\">Delivery<\u002Fh1>\n          <p class=\"page-sub\">Turn delivery on, set the wait time customers see, and the rules that gate every delivery order.<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary\" id=\"dlSave\"><i class=\"ic\" data-lucide=\"check\"><\u002Fi>Save changes<\u002Fbutton>\n      <\u002Fdiv>\n\n      <section data-screen-label=\"Delivery settings\">\n        <div class=\"card\">\n\n          <div class=\"svc-status\" id=\"dlStatus\">\n            <div class=\"svc-ic\"><i class=\"ic\" data-lucide=\"bike\"><\u002Fi><\u002Fdiv>\n            <div>\n              <div class=\"svc-h\">\n                <span>Accepting delivery orders<\u002Fspan>\n                <span class=\"svc-pill\" id=\"dlPill\"><span class=\"dot\"><\u002Fspan><span id=\"dlPillTxt\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"svc-sub\" id=\"dlStatusSub\">When off, the delivery option is hidden from the storefront and existing baskets switch to pick-up.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"svc-act\">\n              <label class=\"switch\"><input type=\"checkbox\" id=\"dlToggle\"><span class=\"track\"><\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Order rule -->\n          <div class=\"svc-section\" id=\"dlSecPricing\">\n            <div class=\"svc-section-head\">\n              <div class=\"svc-section-title\">Minimum order<\u002Fdiv>\n              <div class=\"svc-section-sub\">The smallest basket you'll send out for delivery. Applies to every area.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"svc-fields\">\n              <div class=\"field\">\n                <label class=\"label\" for=\"dlMin\">Minimum order value<\u002Flabel>\n                <div class=\"money-input\">\n                  <span class=\"pfx\" id=\"dlMinPfx\">$<\u002Fspan>\n                  <input class=\"input\" type=\"number\" min=\"0\" step=\"0.5\" id=\"dlMin\" placeholder=\"0.00\">\n                <\u002Fdiv>\n                <p class=\"hint\" style=\"font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.4\">Orders below this can't check out for delivery.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Delivery areas: General vs Custom -->\n          <div class=\"svc-section\" id=\"dlSecAreas\">\n            <div class=\"svc-section-head\">\n              <div class=\"svc-section-title\">Delivery fee &amp; time<\u002Fdiv>\n              <div class=\"svc-section-sub\">Charge one flat rate everywhere, or tune the fee and ETA for each area you deliver to.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"mode-switch\" id=\"dlModeSwitch\" role=\"radiogroup\" aria-label=\"Delivery pricing mode\">\n              <button type=\"button\" class=\"mode-card\" data-mode=\"general\" role=\"radio\">\n                <span class=\"mode-radio\"><\u002Fspan>\n                <span class=\"mode-ic\"><i class=\"ic\" data-lucide=\"globe\"><\u002Fi><\u002Fspan>\n                <span class=\"mode-txt\">\n                  <span class=\"mode-name\">Same everywhere<\u002Fspan>\n                  <span class=\"mode-sub\">One delivery fee and time for every order.<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n              <button type=\"button\" class=\"mode-card\" data-mode=\"custom\" role=\"radio\">\n                <span class=\"mode-radio\"><\u002Fspan>\n                <span class=\"mode-ic\"><i class=\"ic\" data-lucide=\"map-pin\"><\u002Fi><\u002Fspan>\n                <span class=\"mode-txt\">\n                  <span class=\"mode-name\">Custom by area<\u002Fspan>\n                  <span class=\"mode-sub\">A different fee and time per area.<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <!-- GENERAL panel -->\n            <div class=\"mode-panel\" id=\"dlGeneralPanel\">\n              <div class=\"svc-fields\">\n                <div class=\"field\">\n                  <label class=\"label\" for=\"dlFee\">Delivery fee<\u002Flabel>\n                  <div class=\"money-input\">\n                    <span class=\"pfx\" id=\"dlFeePfx\">$<\u002Fspan>\n                    <input class=\"input\" type=\"number\" min=\"0\" step=\"0.5\" id=\"dlFee\" placeholder=\"0.00\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"field\">\n                  <label class=\"label\" for=\"dlTime\">Delivery time<\u002Flabel>\n                  <div class=\"time-input\">\n                    <input type=\"number\" min=\"5\" max=\"240\" step=\"5\" id=\"dlTime\" aria-label=\"Delivery time in minutes\">\n                    <span class=\"suffix\">min<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- CUSTOM panel -->\n            <div class=\"mode-panel\" id=\"dlCustomPanel\">\n              <div class=\"zone-list\" id=\"dlZoneList\"><\u002Fdiv>\n              <div class=\"zone-empty\" id=\"dlZoneEmpty\">\n                <div class=\"ze-ic\"><i class=\"ic\" data-lucide=\"map\"><\u002Fi><\u002Fdiv>\n                <div class=\"ze-title\">No areas yet<\u002Fdiv>\n                <div class=\"ze-sub\">Add the neighbourhoods or zones you deliver to and set a fee and time for each.<\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" class=\"zone-add\" id=\"dlZoneAdd\"><i class=\"ic\" data-lucide=\"plus\"><\u002Fi>Add area<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"svc-preview\" id=\"dlPreview\"><\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"ba4eabc5-146c-413a-9939-b149a35adfe7\"><\u002Fscript>\n<script src=\"1eba992a-351e-41b8-afe3-17eafa4beb1b\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
